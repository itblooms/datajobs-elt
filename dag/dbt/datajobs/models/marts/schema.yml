models:
  - name: fct_job_postings
    config:
      unique_key: posting_id
    columns:
      - name: posting_id
        data_tests: 
          - unique
          - not_null
      - name: job_title
        data_tests:
          - not_null
          - dbt_utils.not_empty_string
      - name: requirenments
        data_tests:
          - dbt_utils.not_empty_string

      - name: employer_id
        data_tests: 
          - not_null
          - relationships:
              arguments:
                to: ref('dim_employers')
                field: id
      - name: location_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_locations')
                field: id
                

  - name: dim_employers
    config:
      unique_key: id
    columns:
      - name: id
        data_tests:
          - not_null
          - unique
      - name: name
        data_tests:
          - not_null
          - unique

  - name: dim_locations
    config:
      unique_key: id
    columns:
      - name: id
        data_tests:
          - not_null
          - unique