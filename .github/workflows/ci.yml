name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12 --quiet

      - name: Install Python Dependencies
        run: uv sync --locked --group=dev

      - name: Lint and Format Python Code
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .

      - name: Test Python Code
        run: |
          uv run pytest tests/ \
            --color=yes \
            --log-cli-level=DEBUG \
            --cov=elt \
            --cov-report=term-missing \
            --cov-report=html \
            --durations=10 \
            -q

      - name: Upload HTML Coverage Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 14

  dbt:
    name: dbt Lint, Parse & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dag/dbt/datajobs

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12 --quiet

      - name: Install Python Dependencies
        run: uv sync --locked --group=dev

      - name: Verify dbt version
        run: uv run dbt --version

      - name: Cache dbt packages
        id: cache-dbt-packages
        uses: actions/cache@v5
        with:
          path: dbt_packages/
          key: dbt-packages-${{ runner.os }}-${{ hashFiles('packages.yml', 'packages-lock.yml') }}
          restore-keys: dbt-packages-${{ runner.os }}-

      - name: Install dbt packages
        if: steps.cache-dbt-packages.outputs.cache-hit != 'true'
        run: uv run dbt deps

      - name: Create profiles.yml
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << EOF
          ohio_transforming:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: ${SNOWFLAKE_ACCOUNT}
                user: ${SNOWFLAKE_USER}
                password: ${SNOWFLAKE_PASSWORD}
                warehouse: ${SNOWFLAKE_WAREHOUSE}
                database: ${SNOWFLAKE_DATABASE}
                schema: ${SNOWFLAKE_SCHEMA}
                role: ${SNOWFLAKE_ROLE}
                threads: 4
          EOF

      - name: Lint SQL Models with sqlfluff
        run: uv run sqlfluff lint models/ --dialect snowflake

      - name: dbt parse
        run:
          uv run dbt parse \
            --project-dir . \
            --target ci \
            --log-level warn

      - name: dbt test
        run:
          uv run dbt test \
            --project-dir . \
            --target ci \
            --log-level warn